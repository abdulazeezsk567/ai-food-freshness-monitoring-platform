services:
  # -------------------------------------------------------------------------
  # 1. Backend Web Service (FastAPI + Uvicorn)
  # -------------------------------------------------------------------------
  - type: web
    name: food-freshness-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: Food Freshness Monitoring Platform
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@foodfreshness.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: food-freshness-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"

  # -------------------------------------------------------------------------
  # 2. Frontend Static Site (React 18 + Vite SPA)
  # -------------------------------------------------------------------------
  - type: web
    name: food-freshness-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: food-freshness-backend
          envVarKey: RENDER_EXTERNAL_URL

# ---------------------------------------------------------------------------
# 3. Managed Relational Database (PostgreSQL 15)
# ---------------------------------------------------------------------------
databases:
  - name: food-freshness-db
    databaseName: food_freshness_db
    plan: free
    region: oregon
